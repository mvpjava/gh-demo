apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-demo-app
  template:
    metadata:
      labels:
        app: nginx-demo-app
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nlb-service
spec:
  type: NodePort 
  selector:
    app: nginx-demo-app 
  ports:
    - protocol: TCP
      port: 80         # The internal ClusterIP port
      targetPort: 80   # The port inside the Nginx container
      nodePort: 32000  # Match this in your AWS Target Group
