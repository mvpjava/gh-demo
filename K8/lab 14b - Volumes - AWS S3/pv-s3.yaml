apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-pv-claim
spec:
  capacity:
    storage: 5Ti # Capacity is often ignored for S3 but must be large (S3 is "unlimited")
  accessModes:
    - ReadWriteMany # Object storage usually supports RWM
  persistentVolumeReclaimPolicy: Retain
  storageClassName: s3-mountpoint-sc
  csi:
    driver: s3.csi.aws.com
    volumeHandle: my-k8s-s3-demo-bucket # <<< MUST BE YOUR EXISTING S3 BUCKET NAME
    volumeAttributes:
      bucketName: ????
      mountOptions: "--allow-other" # Recommended mount option
