apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: prod-ns
  name: read-deployments
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "watch", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-deployments
  namespace: prod-ns
subjects:
  - kind: User 
    name: user1
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: read-deployments   # Th Role to bind to the user
  apiGroup: rbac.authorization.k8s.io
